<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Farah 🌸</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8cdda, #fef6fb);
      font-family: 'Comic Sans MS', 'Poppins', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 320px;
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }

    h1 { margin-bottom: 10px; color: #ff6f91; }
    p { margin-bottom: 20px; color: #555; }
    .bear { font-size: 90px; margin-bottom: 10px; }

    .buttons { position: relative; height: 80px; pointer-events: auto; }

    button {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    #yes { background-color: #ff6f91; color: white; margin-right: 10px; }
    #no { background-color: #ddd; color: #333; position: absolute; }

    .petal {
      position: fixed;
      top: -40px;
      font-size: 22px;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="bear">🧸</div>
    <h1>Farah 💐</h1>
    <p>Can u be my Valentine?</p>

    <div class="buttons">
      <audio id="clairoAudio" loop>
        <!-- Put your OWN Clairo mp3 file in the same folder and name it clairo.mp3 -->
        <source src="clairo.mp3" type="audio/mpeg">
      </audio>
      <button id="yes">Yes!</button>
      <button id="no">No...</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const audio = document.getElementById('clairoAudio');
    const mainCard = document.getElementById('mainCard');

    noBtn.addEventListener('mouseenter', () => {
      const minX = window.innerWidth / 2 - 150;
      const maxX = window.innerWidth / 2 + 150;
      const minY = window.innerHeight / 2 - 100;
      const maxY = window.innerHeight / 2 + 100;

      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    function fadeInMusic() {
      audio.volume = 0;
      audio.play();
      let vol = 0;
      const fade = setInterval(() => {
        vol += 0.02;
        if (vol >= 0.6) {
          audio.volume = 0.6;
          clearInterval(fade);
        } else {
          audio.volume = vol;
        }
      }, 150);
    }

    function startPetals() {
      setInterval(() => {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.textContent = '🌸';
        petal.style.left = Math.random() * window.innerWidth + 'px';
        petal.style.animationDuration = 4 + Math.random() * 4 + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 8000);
      }, 300);
    }

    yesBtn.addEventListener('click', () => {
      // First page: Are you sure?
      mainCard.innerHTML = `
        <h1>Are you sure? 🤔</h1>
        <div class="buttons">
          <button id="confirmYes">Yes arjun!</button>
          <button id="confirmNo">No tf...</button>
        </div>
      `;

      const confirmYes = document.getElementById('confirmYes');
      const confirmNo = document.getElementById('confirmNo');

      confirmNo.addEventListener('mouseenter', () => {
        const minX = window.innerWidth / 2 - 150;
        const maxX = window.innerWidth / 2 + 150;
        const minY = window.innerHeight / 2 - 100;
        const maxY = window.innerHeight / 2 + 100;

        const x = Math.random() * (maxX - minX) + minX;
        const y = Math.random() * (maxY - minY) + minY;

        confirmNo.style.left = `${x}px`;
        confirmNo.style.top = `${y}px`;
      });

      confirmYes.addEventListener('click', () => {
        fadeInMusic();
        startPetals();
        document.body.innerHTML = `
          <div style="text-align:center; z-index:2;">
            <div style="font-size:100px;">🧸🌸🧸</div>
            <h1 style="color:#ff6f91;">THANK YOU</h1>
            <p style="font-size:20px;">shi i knew u was gna say yes.</p>
          </div>
        `;
      });
    });
  </script>

</body>
</html>
